<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comprar libro - Bichas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <section class="product">
      <div class="gallery" aria-label="Portada y contraportada del libro Bichas">
        <img class="cover" src="images/portada.png" alt="Portada del libro Bichas" />
        <img class="cover" src="images/contraportada.png" alt="Contraportada del libro Bichas" />
      </div>
      <div class="info">
        <h1 id="title">Bichas</h1>
        <p id="author">Autor: Moises Muñoz Zapata</p>
        <p id="description">Bichas — una obra de Moises Muñoz Zapata. Sustituye esta sinopsis por la descripción completa si deseas añadir más detalle.</p>
        <p class="price" id="price">16,95€ + gastos de envío 4,50€ (CTT) por ejemplar</p>
        <button id="buyButton">Comprar ahora</button>
        <p class="note">Pago seguro con tarjeta (modo prueba). Se redirigirá a Stripe Checkout.</p>
      </div>
    </section>
  </main>

  <script>
    // On load we can optionally fetch product data from the server in futuras mejoras
  </script>
  <script src="script.js"></script>
</body>
</html>
